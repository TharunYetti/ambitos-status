# Owner & Repo configuration
owner: TharunYetti
repo: ambitos-status

# Endpoints to monitor
sites:
  - name: AmbitOS Official
    url: https://ambitos.com
  - name: AmbitOS-UK
    url: https://app-uk.ambitos.com
  - name: AmbitOS-UK-LiveKit 
    url: wss://livekit-uk.ambitos.com

status-website:
  # For personal testing on GitHub Pages without custom domain:
  baseUrl: /ambitos-status
  # If/when you want status.ambitos.com, uncomment the line below:
  # cname: status.ambitos.com
  
  name: AmbitOS System Status
  theme: dark
  introTitle: "**AmbitOS System Status**"
  introMessage: "Real-time service availability, response times, and incident history."

  navbar:
    - title: Status
      href: /
    - title: AmbitOS Platform
      href: https://ambitos.com

  # 100% White-labeling: Hide third-party badges and links
  customFooter: "© 2026 AmbitOS Inc. All rights reserved."
  customCss: |
    footer a[href*="upptime"], 
    footer a[href*="github.com/upptime"],
    .footer-powered-by {
      display: none !important;
    }
    footer {
      text-align: center;
      padding: 2.5rem 0 1.5rem 0;
      color: #718096;
      font-size: 0.875rem;
    }

